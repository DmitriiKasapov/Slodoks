name: slodoks

services:
  slodoks_db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: slodoks
      MYSQL_USER: slodoks_user
      MYSQL_PASSWORD: slodoks_pass
      MYSQL_ROOT_PASSWORD: rootpassword
    volumes:
      - slodoks_db_data:/var/lib/mysql
    # WordPress must not start before MySQL is ready to accept connections.
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  slodoks_wp:
    image: wordpress:latest
    restart: always
    ports:
      - "8002:80"
    environment:
      WORDPRESS_DB_HOST: slodoks_db
      WORDPRESS_DB_NAME: slodoks
      WORDPRESS_DB_USER: slodoks_user
      WORDPRESS_DB_PASSWORD: slodoks_pass
      # Read by wp_get_environment_type(). The theme only trusts the Vite
      # dev-server marker in local/development environments.
      WP_ENVIRONMENT_TYPE: local
      # WP_DEBUG itself is defined earlier in wp-config.php from this var,
      # so it must stay set. The remaining constants are added via
      # WORDPRESS_CONFIG_EXTRA (eval'd afterwards).
      WORDPRESS_DEBUG: 1
      # Errors are shown on the page AND written to wp-content/debug.log
      # (mounted to host).
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_DEBUG_LOG', true );
        define( 'WP_DEBUG_DISPLAY', true );
        @ini_set( 'display_errors', '1' );
        define( 'SCRIPT_DEBUG', true );
    volumes:
      - ./wp-content:/var/www/html/wp-content
      # Lives in the container otherwise, so pretty permalinks would break
      # every time the container is recreated.
      - ./.htaccess:/var/www/html/.htaccess
    depends_on:
      slodoks_db:
        condition: service_healthy

volumes:
  slodoks_db_data:
